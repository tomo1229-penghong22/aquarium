<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>熱帯魚の水槽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e6ece8; --panel:#f7faf8; --ink:#1d2927; --sub:#5b6966; --line:#d3ddd8;
  --accent:#3d7a55; --accent-soft:#dbeadf; --btn:#e9f0ec; --btn-h:#dbe6e0;
  --wood1:#6b4f36; --wood2:#4b3726; --glow:#f4f1e2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111716; --panel:#1a2220; --ink:#e4ece8; --sub:#98a8a3; --line:#2b3633;
    --accent:#79c18f; --accent-soft:#213229; --btn:#24302d; --btn-h:#2d3b37;
    --wood1:#4f3b2a; --wood2:#35271c; --glow:#1c2a27;
  }
}
:root[data-theme="dark"]{
  --bg:#111716; --panel:#1a2220; --ink:#e4ece8; --sub:#98a8a3; --line:#2b3633;
  --accent:#79c18f; --accent-soft:#213229; --btn:#24302d; --btn-h:#2d3b37;
  --wood1:#4f3b2a; --wood2:#35271c; --glow:#1c2a27;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 600px at 30% -10%, var(--glow), transparent 70%), var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.6}
.wrap{max-width:1320px;margin:0 auto;padding:22px 18px 36px;
  display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
@media (max-width:920px){.wrap{grid-template-columns:1fr}}
h1{font-size:1.35rem;font-weight:700;margin:0 0 12px;letter-spacing:.02em}
.stage{min-width:0}
.tank{position:relative;background:linear-gradient(180deg,#2a302f,#171b1b);padding:10px 10px 0;border-radius:5px 5px 0 0;
  box-shadow:0 24px 50px -22px rgba(10,40,40,.55), inset 0 1px 0 rgba(255,255,255,.12)}
.tank::after{content:"";position:absolute;inset:10px 10px 0;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(200,240,235,.25), inset 0 0 18px rgba(180,230,220,.12)}
.tank canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;border-radius:1px}
.rim{height:10px;background:linear-gradient(180deg,#171b1b,#2a302f);margin:0 -10px}
.stand{height:34px;background:linear-gradient(180deg,var(--wood1),var(--wood2));border-radius:0 0 6px 6px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.note{color:var(--sub);font-size:.85rem;margin:10px 2px 0;max-width:72ch}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 16px 18px}
.panel h2{font-size:1rem;margin:0 0 10px;font-weight:700}
.sec + .sec{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.fishrow{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:10px;padding:6px 0}
.fishrow canvas{width:56px;height:30px}
.fname{font-weight:500;line-height:1.3}
.frange{font-size:.78rem;color:var(--sub)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--btn);
  color:var(--ink);font-size:17px;line-height:1;cursor:pointer;font-family:inherit}
.step button:hover{background:var(--btn-h)}
.step button:focus-visible,.seg button:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.step output{min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}

.temprow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.tempbig{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tempset{font-size:.82rem;color:var(--sub)}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:26px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;
  background:linear-gradient(90deg,#4f8fd6 0%,#6fb3c9 22%,#5fb277 31%,#5fb277 59%,#e0a53a 72%,#e0703a 84%,#c9352b 100%)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;
  background:linear-gradient(90deg,#4f8fd6 0%,#6fb3c9 22%,#5fb277 31%,#5fb277 59%,#e0a53a 72%,#e0703a 84%,#c9352b 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;margin-top:-7px;
  background:#fff;border:2px solid #2a3a36;box-shadow:0 1px 3px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #2a3a36}
.scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--sub);margin-top:-2px}
.status{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:.86rem;line-height:1.55}
.status b{display:block;font-size:.95rem;margin-bottom:2px}

.cond{display:grid;grid-template-columns:1fr 90px;gap:4px 10px;align-items:center;font-size:.85rem}
.cond .lbl small{color:var(--sub);margin-left:4px}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s ease,background .4s ease}
.empty{color:var(--sub);font-size:.85rem}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--btn);color:var(--ink);padding:6px 12px;font-family:inherit;font-size:.85rem;cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.hint{font-size:.78rem;color:var(--sub);margin-top:6px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
.fishrow .ico{border-radius:8px;padding:2px;cursor:zoom-in;transition:background .15s ease}
.fishrow .ico:hover,.fishrow .ico:focus-visible{background:var(--accent-soft)}
.fishrow .ico:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pop{position:fixed;left:0;top:0;z-index:50;width:320px;padding:8px 8px 10px;pointer-events:none;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 22px 44px -18px rgba(5,30,30,.5);
  opacity:0;transform:scale(.92);transition:opacity .18s ease,transform .2s cubic-bezier(.2,.8,.3,1.2)}
.pop.show{opacity:1;transform:scale(1)}
.pop canvas{display:block;width:304px;height:190px;border-radius:9px}
.pop .cap{padding:8px 4px 0;font-size:.84rem;line-height:1.55;color:var(--sub)}
.pop .cap b{display:block;color:var(--ink);font-size:.95rem}
@media (prefers-reduced-motion: reduce){.pop{transition:opacity .01s}}
.tank .ctl{position:absolute;right:22px;bottom:20px;display:flex;gap:8px;z-index:3;opacity:.6;transition:opacity .25s ease}
.tank:hover .ctl,.tank .ctl:focus-within{opacity:1}
.ctlbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 9px;border-radius:18px;
  border:1px solid rgba(255,255,255,.4);background:rgba(12,32,34,.38);color:#fff;font-family:inherit;font-size:.82rem;cursor:pointer;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ctlbtn:hover{background:rgba(12,32,34,.58)}
.ctlbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ctlbtn svg{width:18px;height:18px}
.ctl .lightbtn{display:none;padding:0 13px}
.fshint{position:absolute;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:3;
  padding:6px 14px;border-radius:16px;background:rgba(12,32,34,.55);color:#fff;font-size:.85rem;white-space:nowrap;
  opacity:0;transition:opacity .4s ease;pointer-events:none}
.fshint.show{opacity:1}
.tank.is-fs{padding:0;border-radius:0;background:#000;box-shadow:none}
.tank.is-fs canvas{width:100%;height:100%;aspect-ratio:auto;border-radius:0}
.tank.is-fs .rim{display:none}
.tank.is-fs::after{inset:0;box-shadow:none}
.tank.pseudo-fs{position:fixed;inset:0;z-index:100;width:100vw;height:100vh;height:100dvh}
.tank.is-fs .ctl{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));opacity:1}
.tank.is-fs .ctl .lightbtn{display:inline-flex}
.tank.is-fs.idle .ctl{opacity:0;pointer-events:none}
.tank.is-fs.idle{cursor:none}
@media (prefers-reduced-motion: reduce){.tank .ctl,.fshint{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <h1>熱帯魚の水槽</h1>
    <div class="tank">
      <canvas id="tank" aria-label="熱帯魚が泳ぐ水槽のアニメーション"></canvas>
      <div class="fshint" id="fshint">Esc キーかダブルクリックで元の表示に戻ります</div>
      <div class="ctl">
        <button type="button" class="ctlbtn lightbtn" id="fslight" aria-label="照明を切り替える"></button>
        <button type="button" class="ctlbtn" id="fsbtn" aria-label="全画面表示 (F)" title="全画面表示 (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="rim"></div>
    </div>
    <div class="stand"></div>
    <p class="note">多くの熱帯魚は24〜27℃前後が過ごしやすい水温です。低すぎると代謝が落ちて動きが鈍り、高すぎると水に溶ける酸素が減る一方で魚の酸素消費は増えるため、水面近くで苦しそうにしやすくなります。</p>
  </div>

  <aside class="panel">
    <div class="sec">
      <h2>照明</h2>
      <div class="seg" id="light" role="group" aria-label="照明の切り替え">
        <button type="button" data-v="day" aria-pressed="true">昼(自然光)</button>
        <button type="button" data-v="night" aria-pressed="false">夜(白色LED)</button>
      </div>
    </div>
    <div class="sec">
      <h2>魚を選ぶ</h2>
      <div id="fishlist"></div>
    </div>
    <div class="sec">
      <h2>水温</h2>
      <div class="temprow">
        <div class="tempbig" id="tnow">25.0℃</div>
        <div class="tempset" id="tset">設定 25.0℃</div>
      </div>
      <input type="range" id="temp" min="18" max="34" step="0.5" value="25" aria-label="ヒーターの設定温度">
      <div class="scale"><span>18℃</span><span>22</span><span>26</span><span>30</span><span>34℃</span></div>
      <div class="status" id="status"></div>
    </div>
    <div class="sec">
      <h2>魚のようす</h2>
      <div class="cond" id="cond"></div>
    </div>
    <div class="sec">
      <h2>時間の流れ</h2>
      <div class="seg" id="speed" role="group" aria-label="体調変化の速さ">
        <button type="button" data-v="1" aria-pressed="true">等速</button>
        <button type="button" data-v="5" aria-pressed="false">5倍</button>
        <button type="button" data-v="20" aria-pressed="false">20倍</button>
      </div>
      <div class="hint">水温による体調の変化だけを早送りします。適温に戻すと少しずつ回復します。</div>
    </div>
  </aside>
</div>
<div class="pop" id="pop" aria-hidden="true">
  <canvas id="popcv"></canvas>
  <div class="cap"><b id="popname"></b><span id="popnote"></span></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
